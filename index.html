<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM606 Clicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

.game {
  padding: 25px 15px;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
}

#score {
  font-size: 52px;
  font-weight: bold;
  margin: 25px;
}

.engine {
  width: 210px;
  height: 210px;
  border-radius: 50%;
  border: 0;
  font-size: 26px;
  font-weight: bold;
  background: #ddd;
  color: #111;
}

.engine:active {
  transform: scale(.94);
}

.stats {
  margin: 25px 0;
  font-size: 20px;
}

.upgrade {
  width: 90%;
  max-width: 350px;
  padding: 15px;
  margin: 10px auto;
  border: 1px solid #444;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 17px;
}

.upgrade:disabled {
  opacity: .4;
}
</style>
</head>

<body>

<div class="game">

<h1>OM606 CLICKER</h1>
<div class="subtitle">TURBO DIESEL</div>

<div id="score">0</div>

<button class="engine" onclick="clickEngine()">
🔧<br>ГАЗ!
</button>

<div class="stats">
  Мощность: <b id="power">1</b>
</div>

<button class="upgrade" id="stage1" onclick="buyUpgrade(1)">
  STAGE 1 — +2 мощности<br>
  Цена: 50
</button>

<button class="upgrade" id="stage2" onclick="buyUpgrade(2)">
  STAGE 2 — +5 мощности<br>
  Цена: 200
</button>

<button class="upgrade" id="stage3" onclick="buyUpgrade(3)">
  STAGE 3 — +10 мощности<br>
  Цена: 1000
</button>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let score = 0;
let power = 1;

let upgrades = {
  1: false,
  2: false,
  3: false
};

function clickEngine() {
  score += power;
  update();
}

function buyUpgrade(stage) {

  let price;
  let bonus;

  if (stage === 1) {
    price = 50;
    bonus = 2;
  }

  if (stage === 2) {
    price = 200;
    bonus = 5;
  }

  if (stage === 3) {
    price = 1000;
    bonus = 10;
  }

  if (score >= price && !upgrades[stage]) {

    score -= price;
    power += bonus;
    upgrades[stage] = true;

    update();
  }
}

function update() {

  document.getElementById("score").textContent = score;
  document.getElementById("power").textContent = power;

  for (let i = 1; i <= 3; i++) {
    document.getElementById("stage" + i).disabled = upgrades[i];
  }
}

</script>

</body>
</html>
